keywords: jekyll, jekyll-theme, academic-website, portfolio-website # add your own keywords or leave empty
lang: pt # a language of your site (for example: en, fr, cn, ru, etc.)
icon: 🦉 # the emoji used as the favicon (alternatively, provide image name in /assets/img/)
apple_touch_icon: # image name in /assets/img/ (or a rooted path / absolute URL) used for ios home-screen bookmarks; needs a real 180x180 PNG, since Safari ignores the emoji favicon above. Left empty, iOS falls back to displaying the first page.
url: https://eduardobarista26.github.io # the base hostname & protocol for your site
